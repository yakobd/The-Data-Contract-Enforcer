version: 2
models:
- name: lineage_snapshots
  description: Canonical lineage_snapshots records from the Week 7 Data Contract Enforcer.
  columns:
  - name: captured_at
    description: Timestamp column capturing the date and time when the lineage snapshot
      was recorded.
    tests:
    - not_null
  - name: codebase_root
    description: The codebase_root column represents the local file path of a code
      repository.
  - name: edges
    description: Ensure that the 'edges' column contains valid lineage information
      with high confidence.
    tests:
    - not_null
  - name: git_commit
    description: Git commit SHA at which this snapshot was captured.
  - name: nodes
    description: The 'change_frequency' metadata field must be an integer value between
      0 and 5.
    tests:
    - not_null
  - name: snapshot_id
    description: Unique identifier for this lineage graph snapshot.
    tests:
    - not_null
    - unique
