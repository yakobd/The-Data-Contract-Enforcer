version: 2
models:
- name: lineage_snapshots
  description: Canonical lineage_snapshots records from the Week 7 Data Contract Enforcer.
  columns:
  - name: captured_at
    description: Timestamp column representing the time a lineage snapshot was captured.
    tests:
    - not_null
  - name: codebase_root
    description: The codebase_root column captures the local file path of the git
      repository.
  - name: edges
    description: The `edges` column contains a list of related data models and their
      import relationships.
    tests:
    - not_null
  - name: git_commit
    description: Git commit SHA at which this snapshot was captured.
  - name: nodes
    description: Ensure the 'last_modified' field is less than or equal to the present
      date.
    tests:
    - not_null
  - name: snapshot_id
    description: Unique identifier for this lineage graph snapshot.
    tests:
    - not_null
    - unique
