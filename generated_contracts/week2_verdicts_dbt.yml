version: 2
models:
- name: verdicts
  description: Canonical verdicts records from the Week 7 Data Contract Enforcer.
  columns:
  - name: confidence
    description: Confidence score in [0.0, 1.0] expressing certainty of this extraction
      or classification.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: evaluated_at
    description: Field evaluated_at.
  - name: overall_score
    description: Aggregate audit quality score on a 0.0–5.0 scale.
    tests:
    - not_null
  - name: overall_verdict
    description: Field overall_verdict.
  - name: rubric_id
    description: Field rubric_id.
  - name: rubric_version
    description: Field rubric_version.
  - name: scores.architecture_design
    description: Field scores.architecture_design.
  - name: scores.code_quality
    description: Field scores.code_quality.
  - name: scores.documentation
    description: Field scores.documentation.
  - name: scores.implementation_correctness
    description: Field scores.implementation_correctness.
  - name: scores.test_coverage
    description: Field scores.test_coverage.
  - name: target_ref
    description: Field target_ref.
    tests:
    - not_null
  - name: verdict_id
    description: Unique identifier for an audit verdict record.
    tests:
    - not_null
    - unique
