version: 2
models:
- name: verdicts
  description: Canonical verdicts records from the Week 7 Data Contract Enforcer.
  columns:
  - name: confidence
    description: Confidence score in [0.0, 1.0] expressing certainty of this extraction
      or classification.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: evaluated_at
    description: The evaluated_at column contains timestamps for when verdicts were
      made.
  - name: overall_score
    description: Aggregate audit quality score on a 0.0–5.0 scale.
    tests:
    - not_null
  - name: overall_verdict
    description: The overall verdict must be either 'PASS' or 'FAIL'.
  - name: rubric_id
    description: The rubric_id column contains unique identifiers for assessment rubrics.
  - name: rubric_version
    description: The rubric_version column identifies the version of the rubric used
      for the verdict.
  - name: scores.architecture_design
    description: The scores.architecture_design column contains JSON objects with
      scores and related metadata.
  - name: scores.code_quality
    description: The 'scores.code_quality' column contains a JSON object with score,
      evidence, and notes for code quality assessment.
  - name: scores.documentation
    description: The scores.documentation column contains detailed documentation scores
      and evidence for each audited product.
  - name: scores.implementation_correctness
    description: The 'scores.implementation_correctness' column contains scores and
      related information for implementation correctness.
  - name: scores.test_coverage
    description: The 'scores.test_coverage' column contains a JSON object with score,
      evidence, and notes about test coverage.
  - name: target_ref
    description: Ensure the target_ref column contains valid GitHub repository URLs
    tests:
    - not_null
  - name: verdict_id
    description: Unique identifier for an audit verdict record.
    tests:
    - not_null
    - unique
