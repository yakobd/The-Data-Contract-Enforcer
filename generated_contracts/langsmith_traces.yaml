quality:
  type: SodaChecks
  specification:
    checks for runs:
    - missing_count(id) = 0
    - duplicate_count(id) = 0
    - min(outputs.avg_confidence) >= 0.0
    - max(outputs.avg_confidence) <= 1.0
    - row_count >= 1
    - missing_count(completion_tokens) = 0
    - missing_count(end_time) = 0
quality_extended:
- type: not_null
  description: Required fields must never be null. Nulls indicate a failed or partial
    migration.
  fields:
  - completion_tokens
  - end_time
  - id
  - name
  - prompt_tokens
  - run_type
  - start_time
  - total_tokens
- type: unique
  description: Primary key fields must be unique. Duplicates indicate an idempotency
    violation.
  fields:
  - id
- type: accepted_values
  description: '''run_type'' must only contain registered enum values. Unregistered
    values indicate schema drift.'
  field: run_type
  values: *id001
- type: accepted_values
  description: schema_version must follow MAJOR.MINOR semantic versioning.
  field: schema_version
  pattern: ^\d+\.\d+$
- type: custom
  name: confidence_range_invariant
  description: All confidence scores must be in [0.0, 1.0]. Values > 1.0 indicate
    the 0-100 scale bug (DOMAIN_NOTES.md §Q2).
  fields:
  - outputs.avg_confidence
  rule: 0.0 <= value <= 1.0
  breaking_if_violated: true
  observed_violation: false
- type: custom
  name: temporal_ordering
  description: end_time must be strictly greater than start_time for every run record.
  rule: end_time > start_time
  breaking_if_violated: true
- type: custom
  name: token_accounting_invariant
  description: total_tokens must equal prompt_tokens + completion_tokens exactly.
  rule: total_tokens == prompt_tokens + completion_tokens
  breaking_if_violated: true
- type: custom
  name: cost_non_negative
  description: total_cost must be >= 0. Negative costs indicate a pricing error.
  field: total_cost
  rule: value >= 0.0
  breaking_if_violated: true
- type: custom
  name: statistical_bounds_completion_tokens
  description: 'Statistical profile for ''completion_tokens'': mean=514.386667, p95=213.1,
    p99=11102.0, stddev=3542.263662. Values beyond mean ± 3σ trigger an anomaly alert.'
  field: completion_tokens
  observed_profile:
    min: 0
    max: 39550
    mean: 514.386667
    p25: 0.0
    p50: 0.0
    p75: 140.0
    p95: 213.1
    p99: 11102.0
    stddev: 3542.263662
  rule: mean - 3*stddev <= value <= mean + 3*stddev
- type: custom
  name: statistical_bounds_outputs_embedding_dim
  description: 'Statistical profile for ''outputs.embedding_dim'': mean=1536.0, p95=1536.0,
    p99=1536.0, stddev=0.0. Values beyond mean ± 3σ trigger an anomaly alert.'
