quality:
  type: SodaChecks
  specification:
    checks for events:
    - missing_count(event_id) = 0
    - duplicate_count(event_id) = 0
    - min(payload.overall_confidence) >= 0.0
    - max(payload.overall_confidence) <= 1.0
    - row_count >= 1
    - missing_count(aggregate_id) = 0
    - missing_count(event_type) = 0
quality_extended:
- type: not_null
  description: Required fields must never be null. Nulls indicate a failed or partial
    migration.
  fields:
  - aggregate_id
  - event_id
  - event_type
  - occurred_at
  - recorded_at
  - sequence_number
- type: unique
  description: Primary key fields must be unique. Duplicates indicate an idempotency
    violation.
  fields:
  - event_id
- type: accepted_values
  description: '''aggregate_type'' must only contain registered enum values. Unregistered
    values indicate schema drift.'
  field: aggregate_type
  values: *id001
- type: accepted_values
  description: schema_version must follow MAJOR.MINOR semantic versioning.
  field: schema_version
  pattern: ^\d+\.\d+$
- type: custom
  name: confidence_range_invariant
  description: All confidence scores must be in [0.0, 1.0]. Values > 1.0 indicate
    the 0-100 scale bug (DOMAIN_NOTES.md §Q2).
  fields:
  - payload.overall_confidence
  rule: 0.0 <= value <= 1.0
  breaking_if_violated: true
  observed_violation: false
- type: custom
  name: temporal_ordering
  description: recorded_at must be >= occurred_at. The store cannot record an event
    before it occurs.
  rule: recorded_at >= occurred_at
  breaking_if_violated: true
- type: custom
  name: monotonic_sequence_per_aggregate
  description: sequence_number must be monotonically increasing per aggregate_id with
    no gaps.
  rule: sequence_number = ROW_NUMBER() OVER (PARTITION BY aggregate_id ORDER BY occurred_at)
  breaking_if_violated: true
- type: custom
  name: event_type_registry_compliance
  description: event_type must be PascalCase and registered in the event schema registry.
  field: event_type
  rule: 'regex: ^[A-Z][a-zA-Z0-9]*$'
  registered_types:
  - ApplicationSubmitted
  - DocumentAdded
  - DocumentFormatValidated
  - ExtractionCompleted
  - CreditAnalysisCompleted
  - FraudCheckCompleted
  - LoanDecisionMade
  - RegulatoryPackageGenerated
  breaking_if_violated: true
- type: custom
  name: statistical_bounds_payload_context_token_count
  description: 'Statistical profile for ''payload.context_token_count'': mean=1459.0,
    p95=1459.0, p99=1459.0, stddev=0.0. Values beyond mean ± 3σ trigger an anomaly
    alert.'
  field: payload.context_token_count
  observed_profile:
    min: 1459
    max: 1459
    mean: 1459.0
    p25: 1459.0
    p50: 1459.0
    p75: 1459.0
    p95: 1459.0
    p99: 1459.0
    stddev: 0.0
  rule: mean - 3*stddev <= value <= mean + 3*stddev
- type: custom
  name: statistical_bounds_payload_documents_processed
  description: 'Statistical profile for ''payload.documents_processed'': mean=3.0,
    p95=3.0, p99=3.0, stddev=0.0. Values beyond mean ± 3σ trigger an anomaly alert.'
  field: payload.documents_processed
  observed_profile:
    min: 3
    max: 3
    mean: 3.0
    p25: 3.0
    p50: 3.0
    p75: 3.0
    p95: 3.0
    p99: 3.0
    stddev: 0.0
  rule: mean - 3*stddev <= value <= mean + 3*stddev
llm_annotations:
- column: aggregate_id
  description: The aggregate_id column stores unique identifiers for different types
    of events.
  business_rule: aggregate_id should be a valid UUID format
  cross_column_relationship: aggregate_type and event_id are related to the aggregate_id
    column
- column: aggregate_type
  description: The aggregate_type column identifies the type of event recorded in
    the events table.
  business_rule: 'aggregate_type must be one of the following values: ''LoanApplication'',
    ''Document'', ''Agent'''
  cross_column_relationship: None
- column: event_id
  description: Unique identifier (UUIDv4) for this immutable event record.
  business_rule: IS NOT NULL AND UNIQUE AND matches UUID-v4
  cross_column_relationship: event_id is referenced by metadata.causation_id in child
    events
- column: event_type
  description: PascalCase domain event type registered in the event schema registry.
  business_rule: matches regex ^[A-Z][a-zA-Z0-9]*$
  cross_column_relationship: event_type determines the expected shape of the payload
    object
- column: metadata.causation_id
  description: The causation_id column stores a unique identifier for the event's
    cause.
  business_rule: causation_id IS NOT NULL AND LENGTH(causation_id) = 36 AND causation_id
    MATCHES UUID_REGEX
  cross_column_relationship: The causation_id is related to the metadata.correlation_id,
    which may be used to group related events.
- column: metadata.correlation_id
  description: The correlation_id column is a unique identifier for each event, and
    should be a valid UUID.
  business_rule: metadata.correlation_id IS NOT NULL AND metadata.correlation_id LIKE
    '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
  cross_column_relationship: None
- column: metadata.source_service
  description: The source_service column indicates the service that generated the
    event.
  business_rule: metadata.source_service IN ('week5-ledger-intake', 'week5-ledger',
    'week5-ledger-processor', 'week3-document-refinery')
  cross_column_relationship: None
- column: metadata.user_id
  description: The user_id column should contain a string representing a unique user
    identifier.
  business_rule: metadata.user_id IS NOT NULL AND metadata.user_id NOT IN ('system')
  cross_column_relationship: None
- column: occurred_at
  description: ISO 8601 UTC timestamp when the domain event occurred (business time).
  business_rule: occurred_at <= recorded_at
  cross_column_relationship: occurred_at < recorded_at indicates latency in event
    capture
- column: payload.added_at
  description: The payload.added_at column contains timestamp data in UTC format for
    event occurrences.
  business_rule: payload.added_at must be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDThh:mm:ss.ssssss'
  cross_column_relationship: The payload.added_at column should be consistent with
    the occurred_at column, which represents the actual time of the event occurrence.
- column: payload.agent_id
  description: The agent_id column should contain a valid agent identifier as a string
  business_rule: payload.agent_id IS NOT NULL AND payload.agent_id <> ''
  cross_column_relationship: None
- column: payload.agent_type
  description: Ensure the agent_type column is one of the expected values for document
    processing.
  business_rule: payload.agent_type IN ('document_processing')
  cross_column_relationship: None
- column: payload.anomalies
  description: The anomalies column should not be empty if the application_id is present.
  business_rule: payload.anomalies IS NOT NULL AND LENGTH(payload.anomalies) > 0 IF
    payload.application_id IS NOT NULL
  cross_column_relationship: payload.application_id
- column: payload.applicant_id
  description: The applicant_id column should contain alphanumeric strings starting
    with 'COMP-' and followed by a 3-digit number.
  business_rule: payload.applicant_id LIKE 'COMP-%' AND REGEXP_MATCH(payload.applicant_id,
    '^COMP-[0-9]{3}$')
  cross_column_relationship: None
- column: payload.application_id
  description: The application_id column should contain a string starting with 'APEX-'
    followed by four digits.
  business_rule: payload.application_id LIKE 'APEX-%' AND LENGTH(payload.application_id)
    = 9 AND CAST(SUBSTRING(payload.application_id, 6, 4) AS INTEGER) >= 1
  cross_column_relationship: None
- column: payload.application_reference
  description: 'The application reference must be in the format ''APEX-####'' where
    #### is a four-digit number.'
  business_rule: payload.application_reference REGEXP '^APEX-[0-9]{4}$'
  cross_column_relationship: None
- column: payload.assessed_at
  description: The 'assessed_at' column contains a timestamp of when the event was
    assessed.
  business_rule: payload.assessed_at MUST be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDThh:mm:ss.ffffffZ'
  cross_column_relationship: None
- column: payload.auditor_notes
  description: The auditor's notes provide a textual summary of the audit findings.
  business_rule: LENGTH(payload.auditor_notes) > 0 AND payload.auditor_notes IS NOT
    NULL
  cross_column_relationship: None
- column: payload.called_at
  description: A string column representing the timestamp when an event was called
  business_rule: payload.called_at must be a valid ISO 8601 datetime string
  cross_column_relationship: payload.called_at should be before payload.completed_at
- column: payload.completed_at
  description: The 'completed_at' column represents the timestamp when an event was
    completed.
  business_rule: payload.completed_at MUST be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDThh:mm:ss.ssssss'
  cross_column_relationship: None
- column: payload.contact_email
  description: The contact_email column should contain valid email addresses.
  business_rule: payload.contact_email LIKE '%@%.%'
  cross_column_relationship: None
- column: payload.contact_name
  description: The contact_name field should contain a valid name, not empty or null.
  business_rule: payload.contact_name IS NOT NULL AND LENGTH(TRIM(payload.contact_name))
    > 0
  cross_column_relationship: None
- column: payload.context_source
  description: The context_source column represents the source of an event's context
    information.
  business_rule: payload.context_source IN ('fresh')
  cross_column_relationship: None
- column: payload.context_token_count
  description: The context token count should be a positive integer value.
  business_rule: payload.context_token_count >= 0
  cross_column_relationship: None
- column: payload.created_at
  description: ISO 8601 UTC timestamp when this record was created.
  business_rule: IS NOT NULL AND created_at <= NOW()
  cross_column_relationship: created_at must be <= recorded_at for event records
- column: payload.critical_missing_fields
  description: The critical_missing_fields array should be empty for valid event records.
  business_rule: length(payload.critical_missing_fields) = 0
  cross_column_relationship: None
- column: payload.deadline
  description: Field 'payload.deadline' of type string.
  business_rule: IS NOT NULL
  cross_column_relationship: No known cross-column relationship.
- column: payload.detected_format
  description: Ensure the detected format of the document is 'pdf'.
  business_rule: payload.detected_format = 'pdf'
  cross_column_relationship: None
- column: payload.document_format
  description: The document format must be either 'pdf' or 'xlsx'.
  business_rule: payload.document_format IN ('pdf', 'xlsx')
  cross_column_relationship: None
- column: payload.document_id
  description: The document_id column must be a unique identifier for each document
    processed.
  business_rule: payload.document_id IS NOT NULL AND payload.document_id NOT IN (SELECT
    payload.document_id FROM events WHERE payload.document_id IS NOT NULL GROUP BY
    payload.document_id HAVING COUNT(*) > 1)
  cross_column_relationship: None
- column: payload.document_type
  description: 'Ensure that the document type is one of the expected values: application_proposal,
    income_statement, or balance_sheet.'
  business_rule: payload.document_type IN ('application_proposal', 'income_statement',
    'balance_sheet')
  cross_column_relationship: None
- column: payload.documents_processed
  description: The number of documents processed as part of an event.
  business_rule: payload.documents_processed >= 0
  cross_column_relationship: None
- column: payload.duration_ms
  description: The duration of each event in milliseconds, must be a positive integer.
  business_rule: payload.duration_ms >= 0
  cross_column_relationship: None
- column: payload.events_written
  description: The events_written array contains details about each event processed
    in the data pipeline.
  business_rule: payload.events_written IS NOT NULL AND payload.events_written.length
    > 0
  cross_column_relationship: The payload.duration_ms, payload.executed_at, and payload.extraction_model
    columns are related to the events_written array, providing additional context
    about the processing of the data.
- column: payload.executed_at
  description: The executed_at column represents the timestamp of when an event occurred.
  business_rule: payload.executed_at MUST be a valid ISO 8601 datetime format with
    precision up to microseconds.
  cross_column_relationship: None
- column: payload.extraction_model
  description: Name of the AI model used to extract facts from the document.
  business_rule: matches pattern ^(claude|gpt)-
  cross_column_relationship: extraction_model determines the valid range of confidence
    scores
- column: payload.facts
  description: The 'payload.facts' column contains financial data in an object format,
    with various financial metrics.
  business_rule: Ensure that all numeric fields in 'payload.facts' are valid numbers
    and that required fields are not null.
  cross_column_relationship: The 'payload.executed_at' column could be used to track
    the date when the financial data was extracted.
- column: payload.file_hash
  description: Ensure file_hash is a unique 16-character hexadecimal string
  business_rule: LENGTH(payload.file_hash) = 16 AND REGEXP_MATCH(payload.file_hash,
    '^[0-9a-f]+$')
  cross_column_relationship: None
- column: payload.file_path
  description: The file_path column contains file paths for various financial documents
    associated with a company.
  business_rule: payload.file_path should match the pattern 'documents/[A-Z]{3,5}-[0-9]+/[A-Z]{4}-[0-9]+_[a-zA-Z0-9_]+.(pdf|xlsx)'
  cross_column_relationship: The filename can be extracted from the file_path column
    using a regex or string manipulation function.
- column: payload.file_size_bytes
  description: The file size in bytes for each event must be a positive integer.
  business_rule: payload.file_size_bytes > 0
  cross_column_relationship: None
- column: payload.filename
  description: Filenames should follow the format 'APEX-XXXX_document_type.extension'.
  business_rule: REGEXP_MATCH(payload.filename, '^APEX-\d{4}_[a-zA-Z_]+\.[a-z]+$')
  cross_column_relationship: None
- column: payload.fiscal_year
  description: The fiscal year must be a valid integer between 2020 and 2030.
  business_rule: payload.fiscal_year BETWEEN 2020 AND 2030
  cross_column_relationship: None
- column: payload.has_quality_flags
  description: The 'has_quality_flags' column indicates if the event payload has quality
    flags.
  business_rule: payload.has_quality_flags IS NOT NULL
  cross_column_relationship: None
- column: payload.input_keys
  description: An array of input keys used in the event payload
  business_rule: length(payload.input_keys) >= 1 AND all(item in payload.input_keys
    for item in ['application_id', 'documents', 'raw_facts', 'company_profile', 'document_paths'])
  cross_column_relationship: payload.input_keys should have a corresponding value
    in payload.inputs_validated and payload.is_coherent should be true if all inputs
    are valid
- column: payload.inputs_validated
  description: Validates that the 'inputs_validated' array contains specific required
    fields.
  business_rule: payload.inputs_validated CONTAINS ['application_id', 'document_ids',
    'applicant_registry_access']
  cross_column_relationship: None
- column: payload.is_coherent
  description: The is_coherent field indicates if the payload data is valid and coherent.
  business_rule: payload.is_coherent = TRUE
  cross_column_relationship: None
- column: payload.langgraph_graph_version
  description: The langgraph_graph_version column represents the version of the language
    graph used in the event.
  business_rule: payload.langgraph_graph_version LIKE '%.%.%'
  cross_column_relationship: None
- column: payload.llm_called
  description: The 'llm_called' column indicates if a large language model was used
    for the event.
  business_rule: payload.llm_called IS NOT NULL
  cross_column_relationship: The 'llm_cost_usd' and 'llm_tokens_input' columns are
    related to the 'llm_called' column and should only have non-null values if 'llm_called'
    is True.
- column: payload.llm_cost_usd
  description: The llm_cost_usd column represents the cost in USD for the language
    model used in the event.
  business_rule: llm_cost_usd >= 0
  cross_column_relationship: None
- column: payload.llm_tokens_input
  description: The number of tokens input to the language model for the event.
  business_rule: payload.llm_tokens_input >= 0
  cross_column_relationship: payload.llm_tokens_output
- column: payload.llm_tokens_output
  description: The number of LLM tokens output for a given event.
  business_rule: payload.llm_tokens_output >= 0 AND payload.llm_tokens_output IS NOT
    NULL
  cross_column_relationship: payload.llm_tokens_input
- column: payload.loan_purpose
  description: 'The loan purpose field should be one of four valid options: working_capital,
    acquisition, real_estate, or expansion.'
  business_rule: payload.loan_purpose IN ('working_capital', 'acquisition', 'real_estate',
    'expansion')
  cross_column_relationship: None
- column: payload.loan_term_months
  description: The loan term in months should be a positive integer within the range
    of 12 to 84 months.
  business_rule: payload.loan_term_months > 0 AND payload.loan_term_months BETWEEN
    12 AND 84
  cross_column_relationship: None
- column: payload.model_version
  description: The model version should be in the format 'claude-sonnet-4-YYYYMMDD'.
  business_rule: REGEXP_MATCH(payload.model_version, '^claude-sonnet-4-[0-9]{8}$')
  cross_column_relationship: None
- column: payload.node_name
  description: The node_name column contains the names of the data processing steps.
  business_rule: payload.node_name IN ('validate_inputs', 'run_extraction', 'assess_quality')
  cross_column_relationship: None
- column: payload.node_sequence
  description: The node_sequence column represents the sequence of nodes in the event
    payload.
  business_rule: node_sequence should be a positive integer and unique within each
    event payload.
  cross_column_relationship: node_sequence is related to payload.node_name, payload.output_keys,
    and payload.output_summary as they all describe the same event payload.
- column: payload.output_keys
  description: The 'payload.output_keys' column contains an array of keys representing
    the output of a data processing step.
  business_rule: ARRAY_LENGTH(payload.output_keys) > 0 AND payload.output_keys CONTAINS
    ALL ['validated_inputs', 'document_paths', 'raw_facts', 'page_refs', 'quality_assessment']
  cross_column_relationship: The 'payload.output_summary' and 'payload.overall_confidence'
    columns are related to the 'payload.output_keys' column and provide additional
    information about the data processing outputs.
- column: payload.output_summary
  description: The output summary provides a high-level summary of the processing
    and analysis of a package.
  business_rule: payload.output_summary IS NOT NULL AND LENGTH(payload.output_summary)
    > 0
  cross_column_relationship: payload.overall_confidence, payload.package_id
- column: payload.overall_confidence
  description: The overall confidence score of an event payload, ranging from 0 to
    1.
  business_rule: 0 <= payload.overall_confidence <= 1
  cross_column_relationship: None
- column: payload.package_id
  description: The package_id column contains a string identifier for a package with
    a prefix 'APEX-' followed by four digits.
  business_rule: payload.package_id LIKE 'APEX-%' AND LENGTH(payload.package_id) =
    9
  cross_column_relationship: None
- column: payload.page_count
  description: The payload.page_count column represents the number of pages in a document.
  business_rule: payload.page_count >= 1
  cross_column_relationship: None
- column: payload.pipeline_version
  description: The pipeline version should be a valid version number in the format
    'weekX-v#.#'.
  business_rule: REGEXP_MATCH(payload.pipeline_version, '^week[0-9]+-v[0-9]+\.[0-9]+$')
  cross_column_relationship: None
- column: payload.processing_ms
  description: The processing time in milliseconds for an event payload.
  business_rule: payload.processing_ms > 0 AND payload.processing_ms < 10000
  cross_column_relationship: None
- column: payload.quality_flag_count
  description: The quality_flag_count column represents the number of quality flags
    detected in the event.
  business_rule: payload.quality_flag_count >= 0
  cross_column_relationship: None
- column: payload.raw_text_length
  description: The raw text length of the event payload should be a positive integer
    value.
  business_rule: payload.raw_text_length > 0
  cross_column_relationship: None
- column: payload.ready_at
  description: The ready_at column represents the time when the event payload is ready
    for processing.
  business_rule: payload.ready_at IS NOT NULL AND payload.ready_at MUST BE IN THE
    FORMAT 'YYYY-MM-DDTHH:mm:ss.ffffffZ'
  cross_column_relationship: None
- column: payload.reextraction_recommended
  description: Indicates whether the event data needs to be re-extracted.
  business_rule: payload.reextraction_recommended IS TRUE
  cross_column_relationship: None
- column: payload.requested_amount_usd
  description: The requested_amount_usd column should be a valid decimal number.
  business_rule: CAST(payload.requested_amount_usd AS DECIMAL(15,2)) IS NOT NULL
  cross_column_relationship: None
- column: payload.requested_by
  description: The 'requested_by' column should only contain the value 'system' to
    indicate an automated request.
  business_rule: payload.requested_by = 'system'
  cross_column_relationship: None
- column: payload.required_document_types
  description: Ensure the required document types are present in the 'required_documents'
    array.
  business_rule: ARRAY_CONTAINS(payload.required_documents, payload.required_document_types)
  cross_column_relationship: None
- column: payload.required_documents
  description: The 'required_documents' array should contain at least one of the required
    document types.
  business_rule: payload.required_documents IS NOT NULL AND array_length(payload.required_documents)
    > 0 AND EXISTS (SELECT 1 FROM unnest(payload.required_documents) AS doc WHERE
    doc IN ('application_proposal', 'income_statement', 'balance_sheet'))
  cross_column_relationship: None
- column: payload.session_id
  description: A unique identifier for each session run in the system.
  business_rule: session_id MUST be a valid UUID format
  cross_column_relationship: None
- column: payload.started_at
  description: The 'started_at' column represents the timestamp when an event was
    initiated.
  business_rule: payload.started_at must be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDThh:mm:ss.SSSSSS'
  cross_column_relationship: payload.submitted_at should be greater than or equal
    to payload.started_at
- column: payload.submission_channel
  description: 'Ensure the submission channel is one of the valid values: branch,
    web, mobile, or agent.'
  business_rule: payload.submission_channel IN ('branch', 'web', 'mobile', 'agent')
  cross_column_relationship: None
- column: payload.submitted_at
  description: The submitted_at column represents the timestamp when the event payload
    was submitted.
  business_rule: payload.submitted_at IS NOT NULL AND payload.submitted_at >= '2026-01-01'
    AND payload.submitted_at <= '2026-12-31'
  cross_column_relationship: payload.started_at should be before payload.submitted_at
- column: payload.tables_extracted
  description: The number of tables extracted from the payload for the event.
  business_rule: payload.tables_extracted >= 1 AND payload.tables_extracted <= 100
  cross_column_relationship: None
- column: payload.tool_duration_ms
  description: The tool duration in milliseconds for the event data.
  business_rule: payload.tool_duration_ms >= 0
  cross_column_relationship: None
- column: payload.tool_input_summary
  description: The tool_input_summary column stores a string describing the input
    document type and task performed.
  business_rule: 'payload.tool_input_summary LIKE ''PDF extraction: %'''
  cross_column_relationship: None
- column: payload.tool_name
  description: The tool_name column contains the name of the tool used in the data
    extraction process.
  business_rule: payload.tool_name IS NOT NULL AND payload.tool_name <> ''
  cross_column_relationship: The payload.tool_duration_ms, payload.tool_input_summary,
    payload.tool_output_summary, and payload.uploaded_at columns are closely related
    to the payload.tool_name column and provide additional information about the data
    extraction process.
- column: payload.tool_output_summary
  description: The tool_output_summary column contains a summary of the number of
    financial line items extracted.
  business_rule: payload.tool_output_summary LIKE 'Extracted % financial line items'
  cross_column_relationship: payload.tool_name, payload.uploaded_at, payload.uploaded_by
- column: payload.uploaded_at
  description: The 'uploaded_at' column contains timestamp data for when files were
    uploaded to the system.
  business_rule: payload.uploaded_at must be a valid ISO 8601 timestamp in the format
    YYYY-MM-DDThh:mm:ss.ssssss
  cross_column_relationship: None
- column: payload.uploaded_by
  description: Ensure the 'uploaded_by' field is always populated with a non-empty
    string value.
  business_rule: payload.uploaded_by IS NOT NULL AND payload.uploaded_by <> ''
  cross_column_relationship: None
- column: payload.validated_at
  description: The 'validated_at' column represents the timestamp when an event was
    validated.
  business_rule: validated_at must be a valid ISO 8601 datetime string in the format
    'YYYY-MM-DDTHH:mm:ss.ffffffZ'
  cross_column_relationship: validated_at must be greater than or equal to payload.uploaded_at
    and less than or equal to payload.written_at
- column: payload.validation_duration_ms
  description: The validation duration of an event, in milliseconds.
  business_rule: payload.validation_duration_ms >= 0
  cross_column_relationship: payload.validated_at should be greater than payload.written_at
- column: payload.written_at
  description: Ensure the 'written_at' timestamp is a valid ISO 8601 timestamp
  business_rule: CAST(payload.written_at AS TIMESTAMP) IS NOT NULL
  cross_column_relationship: None
- column: recorded_at
  description: ISO 8601 UTC timestamp when the event was written to the store.
  business_rule: recorded_at >= occurred_at
  cross_column_relationship: recorded_at - occurred_at measures event capture latency
- column: schema_version
  description: The schema_version column stores the version of the data schema used
    for the event.
  business_rule: schema_version MUST be a valid semantic version string (e.g., '1.0',
    '2.3.4')
  cross_column_relationship: None
- column: sequence_number
  description: Monotonically increasing integer per aggregate_id ensuring strict ordering.
  business_rule: sequence_number = ROW_NUMBER() OVER (PARTITION BY aggregate_id ORDER
    BY occurred_at)
  cross_column_relationship: sequence_number gaps indicate missing events; duplicates
    indicate replay errors
lineage:
  upstream:
  - outputs/week5/seed_events.jsonl (Week 5 Event Ledger)
  downstream:
  - id: contracts-runner-py
    description: contracts/runner.py (ValidationRunner)
    fields_consumed:
    - occurred_at
    - aggregate_id
    - event_type
    - recorded_at
    - event_id
    breaking_if_changed:
    - event_id
  - id: enforcer-report
    description: enforcer_report/ (EnforcerReport)
    fields_consumed:
    - occurred_at
    - aggregate_id
    - event_type
    - recorded_at
    - event_id
    breaking_if_changed:
    - event_id
