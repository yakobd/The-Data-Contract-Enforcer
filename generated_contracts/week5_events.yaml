quality:
  type: SodaChecks
  specification:
    checks for events:
    - missing_count(event_id) = 0
    - duplicate_count(event_id) = 0
    - min(payload.overall_confidence) >= 0.0
    - max(payload.overall_confidence) <= 1.0
    - row_count >= 1
    - missing_count(aggregate_id) = 0
    - missing_count(event_type) = 0
quality_extended:
- type: not_null
  description: Required fields must never be null. Nulls indicate a failed or partial
    migration.
  fields:
  - aggregate_id
  - event_id
  - event_type
  - occurred_at
  - recorded_at
  - sequence_number
- type: unique
  description: Primary key fields must be unique. Duplicates indicate an idempotency
    violation.
  fields:
  - event_id
- type: accepted_values
  description: '''aggregate_type'' must only contain registered enum values. Unregistered
    values indicate schema drift.'
  field: aggregate_type
  values: *id001
- type: accepted_values
  description: schema_version must follow MAJOR.MINOR semantic versioning.
  field: schema_version
  pattern: ^\d+\.\d+$
- type: custom
  name: confidence_range_invariant
  description: All confidence scores must be in [0.0, 1.0]. Values > 1.0 indicate
    the 0-100 scale bug (DOMAIN_NOTES.md §Q2).
  fields:
  - payload.overall_confidence
  rule: 0.0 <= value <= 1.0
  breaking_if_violated: true
  observed_violation: false
- type: custom
  name: temporal_ordering
  description: recorded_at must be >= occurred_at. The store cannot record an event
    before it occurs.
  rule: recorded_at >= occurred_at
  breaking_if_violated: true
- type: custom
  name: monotonic_sequence_per_aggregate
  description: sequence_number must be monotonically increasing per aggregate_id with
    no gaps.
  rule: sequence_number = ROW_NUMBER() OVER (PARTITION BY aggregate_id ORDER BY occurred_at)
  breaking_if_violated: true
- type: custom
  name: event_type_registry_compliance
  description: event_type must be PascalCase and registered in the event schema registry.
  field: event_type
  rule: 'regex: ^[A-Z][a-zA-Z0-9]*$'
  registered_types:
  - ApplicationSubmitted
  - DocumentAdded
  - DocumentFormatValidated
  - ExtractionCompleted
  - CreditAnalysisCompleted
  - FraudCheckCompleted
  - LoanDecisionMade
  - RegulatoryPackageGenerated
  breaking_if_violated: true
- type: custom
  name: statistical_bounds_payload_context_token_count
  description: 'Statistical profile for ''payload.context_token_count'': mean=1459.0,
    p95=1459.0, p99=1459.0, stddev=0.0. Values beyond mean ± 3σ trigger an anomaly
    alert.'
  field: payload.context_token_count
  observed_profile:
    min: 1459
    max: 1459
    mean: 1459.0
    p25: 1459.0
    p50: 1459.0
    p75: 1459.0
    p95: 1459.0
    p99: 1459.0
    stddev: 0.0
  rule: mean - 3*stddev <= value <= mean + 3*stddev
- type: custom
  name: statistical_bounds_payload_documents_processed
  description: 'Statistical profile for ''payload.documents_processed'': mean=3.0,
    p95=3.0, p99=3.0, stddev=0.0. Values beyond mean ± 3σ trigger an anomaly alert.'
  field: payload.documents_processed
  observed_profile:
    min: 3
    max: 3
    mean: 3.0
    p25: 3.0
    p50: 3.0
    p75: 3.0
    p95: 3.0
    p99: 3.0
    stddev: 0.0
  rule: mean - 3*stddev <= value <= mean + 3*stddev
llm_annotations:
- column: aggregate_id
  description: The aggregate_id column stores a universally unique identifier (UUID)
    for each event.
  business_rule: aggregate_id MUST be a valid UUID format and UNIQUE across the entire
    table.
  cross_column_relationship: The aggregate_id is associated with the aggregate_type
    and event_id columns, which provide additional context about the event.
- column: aggregate_type
  description: The `aggregate_type` column stores high-level categorization of events
    in the system.
  business_rule: 'The `aggregate_type` column must contain one of the following values:
    ''LoanApplication'', ''Document'', ''Agent'''
  cross_column_relationship: The `aggregate_id`, `event_id`, and `event_type` columns
    are related to the `aggregate_type` column and provide additional context about
    the event.
- column: event_id
  description: Unique identifier (UUIDv4) for this immutable event record.
  business_rule: IS NOT NULL AND UNIQUE AND matches UUID-v4
  cross_column_relationship: event_id is referenced by metadata.causation_id in child
    events
- column: event_type
  description: PascalCase domain event type registered in the event schema registry.
  business_rule: matches regex ^[A-Z][a-zA-Z0-9]*$
  cross_column_relationship: event_type determines the expected shape of the payload
    object
- column: metadata.causation_id
  description: The causation_id column stores a unique identifier for the event that
    caused the current event.
  business_rule: causation_id MUST be a valid UUID string that is unique within the
    events table
  cross_column_relationship: The causation_id column is related to the event_id column,
    as the causation_id of one event may be the event_id of another event.
- column: metadata.correlation_id
  description: A unique identifier to connect events related to the same user action.
  business_rule: metadata.correlation_id IS NOT NULL AND LEN(metadata.correlation_id)
    = 36 AND ISNUMERIC(REPLACE(REPLACE(REPLACE(metadata.correlation_id, '-', ''),
    'a', ''), 'b', '')) = 1
  cross_column_relationship: metadata.causation_id, metadata.source_service, metadata.user_id
- column: metadata.source_service
  description: The source_service column indicates the service that generated the
    event.
  business_rule: metadata.source_service IN ('week5-ledger-intake', 'week5-ledger',
    'week5-ledger-processor', 'week3-document-refinery')
  cross_column_relationship: The metadata.causation_id, metadata.correlation_id, and
    metadata.user_id columns are related to the metadata.source_service column.
- column: metadata.user_id
  description: The user_id column should contain a unique identifier for each user.
  business_rule: metadata.user_id IS NOT NULL AND metadata.user_id <> 'system'
  cross_column_relationship: None
- column: occurred_at
  description: ISO 8601 UTC timestamp when the domain event occurred (business time).
  business_rule: occurred_at <= recorded_at
  cross_column_relationship: occurred_at < recorded_at indicates latency in event
    capture
- column: payload.added_at
  description: The added_at column represents the timestamp when the event was created.
  business_rule: payload.added_at should be a valid timestamp in the format 'YYYY-MM-DDTHH:mm:ss.ffffffZ'
  cross_column_relationship: payload.added_at should be less than or equal to occurred_at
- column: payload.agent_id
  description: The agent_id column should be a non-null string value without leading
    or trailing whitespace.
  business_rule: payload.agent_id IS NOT NULL AND TRIM(payload.agent_id) = payload.agent_id
  cross_column_relationship: None
- column: payload.agent_type
  description: Ensure the 'agent_type' field in the 'events' table is 'document_processing'.
  business_rule: payload.agent_type = 'document_processing'
  cross_column_relationship: None
- column: payload.anomalies
  description: The payload.anomalies column should be an array with at least one element.
  business_rule: length(payload.anomalies) > 0
  cross_column_relationship: None
- column: payload.applicant_id
  description: Ensure the applicant_id column contains a valid COMP-XXX format string.
  business_rule: REGEXP_MATCH(payload.applicant_id, '^COMP-[0-9]{3}$')
  cross_column_relationship: None
- column: payload.application_id
  description: Ensure the application ID follows the pattern 'APEX-xxxx' where xxxx
    is a 4-digit number.
  business_rule: REGEXP_MATCH(payload.application_id, '^APEX-[0-9]{4}$')
  cross_column_relationship: None
- column: payload.application_reference
  description: The application_reference column contains unique identifiers for APEX
    application records.
  business_rule: payload.application_reference LIKE 'APEX-%' AND LENGTH(payload.application_reference)
    = 10
  cross_column_relationship: None
- column: payload.assessed_at
  description: The 'assessed_at' column represents the timestamp when an event was
    assessed, in ISO 8601 format.
  business_rule: assessed_at IS NOT NULL AND assessed_at <= CURRENT_TIMESTAMP
  cross_column_relationship: None
- column: payload.auditor_notes
  description: The auditor notes field should contain a summary of the audit findings
    in plain language.
  business_rule: LENGTH(payload.auditor_notes) > 0 AND LENGTH(payload.auditor_notes)
    < 201
  cross_column_relationship: None
- column: payload.called_at
  description: The 'called_at' column represents the timestamp of when an event was
    called.
  business_rule: payload.called_at MUST be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDTHH:MM:SS.mmmmmm'
  cross_column_relationship: None
- column: payload.completed_at
  description: The completed_at column represents the timestamp when an event was
    completed.
  business_rule: payload.completed_at must be a valid ISO 8601 timestamp in the format
    YYYY-MM-DDTHH:mm:ss.SSSSSS
  cross_column_relationship: None
- column: payload.contact_email
  description: The contact_email column should contain a valid email address for each
    event.
  business_rule: payload.contact_email LIKE '%@%.%'
  cross_column_relationship: None
- column: payload.contact_name
  description: The contact_name column should contain only valid names, without any
    special characters or numbers.
  business_rule: payload.contact_name REGEXP '^[A-Za-z\s]+$'
  cross_column_relationship: None
- column: payload.context_source
  description: The context_source column contains the source of the event context,
    which is a string value.
  business_rule: payload.context_source IS NOT NULL AND payload.context_source <>
    ''
  cross_column_relationship: None
- column: payload.context_token_count
  description: The number of tokens in the context of the event.
  business_rule: payload.context_token_count >= 0 AND payload.context_token_count
    IS NOT NULL
  cross_column_relationship: None
- column: payload.created_at
  description: ISO 8601 UTC timestamp when this record was created.
  business_rule: IS NOT NULL AND created_at <= NOW()
  cross_column_relationship: created_at must be <= recorded_at for event records
- column: payload.critical_missing_fields
  description: Array of critical missing fields in an event payload.
  business_rule: payload.critical_missing_fields.length = 0
  cross_column_relationship: None
- column: payload.deadline
  description: Ensure the 'deadline' field is a valid ISO 8601 datetime string with
    time zone information.
  business_rule: CAST(payload.deadline AS TIMESTAMP) IS NOT NULL AND payload.deadline
    LIKE '%Z'
  cross_column_relationship: None
- column: payload.detected_format
  description: The 'detected_format' field should be 'pdf' and match the 'document_format'
    field.
  business_rule: payload.detected_format = 'pdf'
  cross_column_relationship: payload.detected_format should match payload.document_format
- column: payload.document_format
  description: Validate that the document format is either 'pdf' or 'xlsx'.
  business_rule: payload.document_format IN ('pdf', 'xlsx')
  cross_column_relationship: None
- column: payload.document_id
  description: Ensure the document_id column is a valid string format with no duplicates.
  business_rule: payload.document_id IS NOT NULL AND payload.document_id NOT IN (SELECT
    DISTINCT payload.document_id FROM events)
  cross_column_relationship: None
- column: payload.document_type
  description: The payload.document_type column stores the type of document, such
    as application proposal, income statement, or balance sheet.
  business_rule: payload.document_type IN ('application_proposal', 'income_statement',
    'balance_sheet')
  cross_column_relationship: None
- column: payload.documents_processed
  description: The number of documents processed in the event payload.
  business_rule: payload.documents_processed >= 0 AND payload.documents_processed
    IS NOT NULL
  cross_column_relationship: The number of documents processed should be related to
    the number of events written in the payload.events_written column.
- column: payload.duration_ms
  description: The duration in milliseconds of an event, which should be a positive
    integer.
  business_rule: payload.duration_ms >= 0
  cross_column_relationship: None
- column: payload.events_written
  description: An array of event metadata, including stream ID, event type, and stream
    position.
  business_rule: payload.events_written IS NOT NULL AND payload.events_written.length
    > 0 AND EVERY(payload.events_written, event -> event.stream_id IS NOT NULL AND
    event.event_type IS NOT NULL AND event.stream_position IS NOT NULL)
  cross_column_relationship: payload.documents_processed, payload.duration_ms, payload.executed_at,
    and payload.extraction_model are all related to the events represented in payload.events_written
- column: payload.executed_at
  description: The executed_at column contains ISO 8601 formatted timestamps indicating
    when an event occurred.
  business_rule: payload.executed_at SHOULD be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDThh:mm:ss.ssssss'
  cross_column_relationship: None
- column: payload.extraction_model
  description: Name of the AI model used to extract facts from the document.
  business_rule: matches pattern ^(claude|gpt)-
  cross_column_relationship: extraction_model determines the valid range of confidence
    scores
- column: payload.facts
  description: Field 'payload.facts' of type object.
  business_rule: IS NOT NULL
  cross_column_relationship: No known cross-column relationship.
- column: payload.file_hash
  description: The file_hash column contains a unique identifier for each file in
    the events table.
  business_rule: payload.file_hash LIKE '[a-f0-9]{16}'
  cross_column_relationship: None
- column: payload.file_path
  description: The file path column contains file paths for financial documents related
    to a company.
  business_rule: payload.file_path LIKE 'documents/COMP-[0-9]{3}/APEX-[0-9]{4}_%.pdf'
    OR payload.file_path LIKE 'documents/COMP-[0-9]{3}/APEX-[0-9]{4}_%.xlsx'
  cross_column_relationship: None
- column: payload.file_size_bytes
  description: The file size in bytes should be a positive integer.
  business_rule: payload.file_size_bytes >= 0
  cross_column_relationship: None
- column: payload.filename
  description: The filename should follow the pattern 'APEX-XXXX_<file_type>.<extension>'.
  business_rule: REGEXP_MATCH(payload.filename, '^APEX-[0-9]{4}_[a-zA-Z_]+\.(?:pdf|xlsx)$')
  cross_column_relationship: None
- column: payload.fiscal_year
  description: The fiscal year should be a positive integer representing the calendar
    year.
  business_rule: payload.fiscal_year > 0
  cross_column_relationship: None
- column: payload.has_quality_flags
  description: The 'has_quality_flags' column indicates whether the event payload
    has quality flags enabled.
  business_rule: payload.has_quality_flags = true
  cross_column_relationship: None
- column: payload.input_keys
  description: The input_keys column contains an array of keys that describe the input
    data.
  business_rule: payload.input_keys IS NOT EMPTY AND payload.input_keys ELEMENT_OF
    ['application_id', 'documents', 'document_paths', 'raw_facts', 'company_profile']
  cross_column_relationship: None
- column: payload.inputs_validated
  description: Ensure that the 'inputs_validated' array contains required data fields
    for processing the event payload.
  business_rule: payload.inputs_validated IS NOT NULL AND ARRAY_LENGTH(payload.inputs_validated)
    > 0 AND ALL(item IN payload.inputs_validated WHERE item IN ('application_id',
    'document_ids', 'applicant_registry_access'))
  cross_column_relationship: None
- column: payload.is_coherent
  description: The is_coherent field indicates whether the input data is valid and
    coherent.
  business_rule: payload.is_coherent = TRUE
  cross_column_relationship: payload.inputs_validated
- column: payload.langgraph_graph_version
  description: The langgraph_graph_version column represents the version of the language
    graph used for the event.
  business_rule: langgraph_graph_version MUST be a valid semantic version string (e.g.,
    '1.0.0-sim')
  cross_column_relationship: None
- column: payload.llm_called
  description: The 'llm_called' column indicates whether a large language model was
    used for the event.
  business_rule: payload.llm_called IS NOT NULL
  cross_column_relationship: None
- column: payload.llm_cost_usd
  description: The 'llm_cost_usd' column represents the cost of the language model
    in USD for a given event.
  business_rule: llm_cost_usd >= 0 AND llm_cost_usd <= 100
  cross_column_relationship: None
- column: payload.llm_tokens_input
  description: The number of tokens input to the large language model for this event.
  business_rule: payload.llm_tokens_input >= 0
  cross_column_relationship: None
- column: payload.llm_tokens_output
  description: The number of output tokens generated by the language model in the
    event.
  business_rule: payload.llm_tokens_output >= 0
  cross_column_relationship: payload.llm_tokens_input
- column: payload.loan_purpose
  description: The 'loan_purpose' column contains the purpose of the loan, with valid
    values such as 'working_capital', 'acquisition', 'real_estate', and 'expansion'.
  business_rule: payload.loan_purpose IN ('working_capital', 'acquisition', 'real_estate',
    'expansion')
  cross_column_relationship: None
- column: payload.loan_term_months
  description: The loan term in months must be a positive integer value.
  business_rule: payload.loan_term_months >= 1 AND payload.loan_term_months IS NOT
    NULL
  cross_column_relationship: None
- column: payload.model_version
  description: The model version should be a string in the format 'claude-sonnet-4-YYYYMMDD'.
  business_rule: payload.model_version LIKE 'claude-sonnet-4-[0-9]{8}'
  cross_column_relationship: None
- column: payload.node_name
  description: The node_name column represents the name of a data processing step
    in the events pipeline.
  business_rule: payload.node_name IN ('validate_inputs', 'run_extraction', 'assess_quality')
  cross_column_relationship: None
- column: payload.node_sequence
  description: The node_sequence column represents the order of nodes in a sequence.
  business_rule: payload.node_sequence MUST be a positive integer and unique within
    the same payload.
  cross_column_relationship: The node_sequence column is related to the payload.model_version,
    payload.node_name, payload.output_keys, and payload.output_summary columns, as
    they all describe the same sequence of nodes.
- column: payload.output_keys
  description: The payload.output_keys column contains an array of output keys for
    each event.
  business_rule: payload.output_keys should be an array with at least one element
    and all elements should be non-empty strings.
  cross_column_relationship: The payload.output_keys array should be related to the
    other payload columns (payload.node_name, payload.node_sequence, payload.output_summary,
    payload.overall_confidence) to provide context for the event.
- column: payload.output_summary
  description: Summarizes the output of a document processing step in a credit analysis
    workflow.
  business_rule: payload.output_summary IS NOT NULL AND LENGTH(payload.output_summary)
    > 0
  cross_column_relationship: payload.output_summary is related to payload.overall_confidence,
    payload.package_id, and payload.node_sequence which provide additional context
    about the credit analysis process.
- column: payload.overall_confidence
  description: The overall confidence score for the event, a number between 0 and
    1.
  business_rule: payload.overall_confidence >= 0 AND payload.overall_confidence <=
    1
  cross_column_relationship: None
- column: payload.package_id
  description: The package_id column contains unique identifiers for each package
    processed by the system.
  business_rule: payload.package_id REGEXP '^APEX-[0-9]{4}$'
  cross_column_relationship: None
- column: payload.page_count
  description: The page_count column represents the number of pages in the event payload.
  business_rule: payload.page_count >= 1
  cross_column_relationship: None
- column: payload.pipeline_version
  description: Validates that the pipeline version is in the format 'week{number}-v{version
    number}.{patch number}'.
  business_rule: REGEXP_MATCH(payload.pipeline_version, '^week\d+-v\d+\.\d+$')
  cross_column_relationship: None
- column: payload.processing_ms
  description: The processing time in milliseconds for the event payload.
  business_rule: payload.processing_ms >= 0
  cross_column_relationship: None
- column: payload.quality_flag_count
  description: The quality_flag_count field represents the number of quality flags
    detected in the event payload.
  business_rule: quality_flag_count >= 0
  cross_column_relationship: None
- column: payload.raw_text_length
  description: The raw text length of an event should be a positive integer.
  business_rule: payload.raw_text_length >= 0
  cross_column_relationship: None
- column: payload.ready_at
  description: The payload.ready_at column represents the timestamp when the event
    was ready to be processed.
  business_rule: payload.ready_at should be a valid ISO-8601 formatted timestamp
  cross_column_relationship: None
- column: payload.reextraction_recommended
  description: The reextraction_recommended flag indicates whether the event payload
    should be reextracted.
  business_rule: payload.reextraction_recommended IS TRUE
  cross_column_relationship: None
- column: payload.requested_amount_usd
  description: The requested amount should be a valid decimal value in USD.
  business_rule: CAST(payload.requested_amount_usd AS DECIMAL) >= 0
  cross_column_relationship: None
- column: payload.requested_by
  description: The 'requested_by' column should be a string with the value 'system'.
  business_rule: payload.requested_by = 'system'
  cross_column_relationship: None
- column: payload.required_document_types
  description: The 'required_document_types' array must contain valid document types
    for the financial request.
  business_rule: ARRAY_CONTAINS(payload.required_document_types, ['application_proposal',
    'income_statement', 'balance_sheet'])
  cross_column_relationship: None
- column: payload.required_documents
  description: The 'required_documents' field must contain at least one valid document
    type.
  business_rule: payload.required_documents IS NOT NULL AND payload.required_documents
    <> '[]'
  cross_column_relationship: None
- column: payload.session_id
  description: A unique identifier for each run session of a data processing job.
  business_rule: session_id MUST be a valid UUID format
  cross_column_relationship: None
- column: payload.started_at
  description: The 'started_at' column represents the timestamp when an event was
    initiated.
  business_rule: payload.started_at MUST be a valid ISO 8601 timestamp in the format
    'YYYY-MM-DDThh:mm:ss.ffffffZ'
  cross_column_relationship: payload.submitted_at MUST be greater than payload.started_at
- column: payload.submission_channel
  description: The 'submission_channel' column indicates the source of the event submission.
  business_rule: payload.submission_channel IN ('branch', 'web', 'mobile', 'agent')
  cross_column_relationship: None
- column: payload.submitted_at
  description: The submitted_at column represents the timestamp when an event was
    submitted.
  business_rule: submitted_at must be a valid ISO-8601 datetime string in the format
    YYYY-MM-DDThh:mm:ss.fffZ
  cross_column_relationship: None
- column: payload.tables_extracted
  description: The number of tables extracted during an event.
  business_rule: payload.tables_extracted >= 1
  cross_column_relationship: None
- column: payload.tool_duration_ms
  description: The tool duration in milliseconds for the event payload.
  business_rule: payload.tool_duration_ms >= 0 AND payload.tool_duration_ms IS NOT
    NULL
  cross_column_relationship: None
- column: payload.tool_input_summary
  description: The 'tool_input_summary' column contains a summary of the input data
    for a tool used in the event.
  business_rule: 'REGEXP_MATCH(payload.tool_input_summary, ''^PDF extraction: [a-zA-Z_]+$'')'
  cross_column_relationship: The 'tool_name' column should indicate the tool that
    processed the input data summarized in 'tool_input_summary'.
- column: payload.tool_name
  description: The tool_name column represents the name of the tool used in the data
    processing pipeline.
  business_rule: payload.tool_name IS NOT NULL AND payload.tool_name <> ''
  cross_column_relationship: None
- column: payload.tool_output_summary
  description: The 'payload.tool_output_summary' column contains a summary of the
    financial line items extracted by a tool.
  business_rule: LENGTH(TRIM(payload.tool_output_summary)) > 0 AND payload.tool_output_summary
    LIKE 'Extracted % financial line items'
  cross_column_relationship: payload.tool_name, payload.uploaded_at, payload.uploaded_by
- column: payload.uploaded_at
  description: Field 'payload.uploaded_at' of type string.
  business_rule: IS NOT NULL
  cross_column_relationship: No known cross-column relationship.
- column: payload.uploaded_by
  description: The 'uploaded_by' column should only contain the value 'applicant'.
  business_rule: payload.uploaded_by = 'applicant'
  cross_column_relationship: None
- column: payload.validated_at
  description: Ensure the 'validated_at' timestamp is a valid ISO 8601 format date
    and time.
  business_rule: CAST(payload.validated_at AS TIMESTAMP) IS NOT NULL
  cross_column_relationship: None
- column: payload.validation_duration_ms
  description: The validation_duration_ms column represents the time in milliseconds
    for the event validation process.
  business_rule: validation_duration_ms >= 0
  cross_column_relationship: The validation_duration_ms should be less than or equal
    to the time difference between payload.validated_at and payload.written_at.
- column: payload.written_at
  description: The 'written_at' column represents the timestamp when the event was
    written to the database.
  business_rule: payload.written_at MUST be a valid ISO 8601 timestamp format
  cross_column_relationship: None
- column: recorded_at
  description: ISO 8601 UTC timestamp when the event was written to the store.
  business_rule: recorded_at >= occurred_at
  cross_column_relationship: recorded_at - occurred_at measures event capture latency
- column: schema_version
  description: The schema_version column stores the version of the data schema used
    for the event.
  business_rule: schema_version SHOULD BE a valid semantic version (e.g., '1.0', '2.3.1')
  cross_column_relationship: None
- column: sequence_number
  description: Monotonically increasing integer per aggregate_id ensuring strict ordering.
  business_rule: sequence_number = ROW_NUMBER() OVER (PARTITION BY aggregate_id ORDER
    BY occurred_at)
  cross_column_relationship: sequence_number gaps indicate missing events; duplicates
    indicate replay errors
lineage:
  upstream:
  - outputs/week5/seed_events.jsonl (Week 5 Event Ledger)
  downstream:
  - id: contracts-runner-py
    description: contracts/runner.py (ValidationRunner)
    fields_consumed:
    - event_id
    - occurred_at
    - sequence_number
    - event_type
    - aggregate_id
    breaking_if_changed:
    - event_id
  - id: enforcer-report
    description: enforcer_report/ (EnforcerReport)
    fields_consumed:
    - event_id
    - occurred_at
    - sequence_number
    - event_type
    - aggregate_id
    breaking_if_changed:
    - event_id
