version: 2
models:
- name: extractions
  description: Canonical extractions records from the Week 7 Data Contract Enforcer.
  columns:
  - name: doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - not_null
    - unique
  - name: entities
    description: The 'entities' column contains an array of entity objects with various
      properties.
  - name: extracted_at
    description: The extracted_at column stores timestamp values for data extraction
      events.
  - name: extracted_facts
    description: Array of fact objects extracted from the document, each with text,
      entities, and confidence.
    tests:
    - not_null
  - name: extraction_model
    description: Name of the AI model used to extract facts from the document.
    tests:
    - not_null
  - name: processing_time_ms
    description: Processing time in milliseconds for each data extraction from the
      source.
  - name: source_hash
    description: The source_hash column should be a unique identifier for each extraction.
  - name: source_path
    description: Store file paths for documents that have been extracted and processed.
  - name: token_count.input
    description: The token_count.input column contains the number of tokens in the
      input data.
  - name: token_count.output
    description: The token_count.output column represents the number of tokens extracted
      from a source.
