version: 2
models:
- name: extractions
  description: Canonical extractions records from the Week 7 Data Contract Enforcer.
  columns:
  - name: doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - not_null
    - unique
  - name: entities
    description: Field entities.
  - name: extracted_at
    description: Field extracted_at.
  - name: extracted_facts
    description: Array of fact objects extracted from the document, each with text,
      entities, and confidence.
    tests:
    - not_null
  - name: extraction_model
    description: Name of the AI model used to extract facts from the document.
    tests:
    - not_null
  - name: processing_time_ms
    description: Field processing_time_ms.
  - name: source_hash
    description: Field source_hash.
  - name: source_path
    description: Field source_path.
  - name: token_count.input
    description: Field token_count.input.
  - name: token_count.output
    description: Field token_count.output.
