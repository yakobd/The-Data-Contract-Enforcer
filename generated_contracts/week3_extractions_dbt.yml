version: 2
models:
- name: extractions
  description: Canonical extractions records from the Week 7 Data Contract Enforcer.
  columns:
  - name: doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - not_null
    - unique
  - name: entities
    description: The 'entities' column contains an array of extracted entities with
      metadata about each entity.
  - name: extracted_at
    description: The extracted_at column represents the timestamp when data was extracted
      from a source.
  - name: extracted_facts
    description: Array of fact objects extracted from the document, each with text,
      entities, and confidence.
    tests:
    - not_null
  - name: extraction_model
    description: Name of the AI model used to extract facts from the document.
    tests:
    - not_null
  - name: processing_time_ms
    description: The processing time for data extractions, measured in milliseconds.
  - name: source_hash
    description: The source_hash column contains hashed values that uniquely identify
      each data extraction.
  - name: source_path
    description: The source_path column contains file paths of various financial and
      audit reports.
  - name: token_count.input
    description: The token_count.input column represents the number of tokens extracted
      from a source.
  - name: token_count.output
    description: The token_count.output column represents the number of tokens extracted
      from the source_path.
