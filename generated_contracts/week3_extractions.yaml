quality:
  type: SodaChecks
  specification:
    checks for extractions:
    - missing_count(doc_id) = 0
    - duplicate_count(doc_id) = 0
    - row_count >= 1
    - missing_count(extracted_facts) = 0
    - missing_count(extraction_model) = 0
quality_extended:
- type: not_null
  description: Required fields must never be null. Nulls indicate a failed or partial
    migration.
  fields:
  - doc_id
  - extracted_facts
  - extraction_model
- type: unique
  description: Primary key fields must be unique. Duplicates indicate an idempotency
    violation.
  fields:
  - doc_id
- type: accepted_values
  description: schema_version must follow MAJOR.MINOR semantic versioning.
  field: schema_version
  pattern: ^\d+\.\d+$
- type: custom
  name: created_at_not_future
  description: created_at must not be a future timestamp.
  rule: created_at <= NOW()
  breaking_if_violated: false
- type: custom
  name: statistical_bounds_processing_time_ms
  description: 'Statistical profile for ''processing_time_ms'': mean=15558.26, p95=99127.85,
    p99=222266.89, stddev=47904.968873. Values beyond mean ± 3σ trigger an anomaly
    alert.'
  field: processing_time_ms
  observed_profile:
    min: 0
    max: 271188
    mean: 15558.26
    p25: 1429.5
    p50: 1604.0
    p75: 4267.0
    p95: 99127.85
    p99: 222266.89
    stddev: 47904.968873
  rule: mean - 3*stddev <= value <= mean + 3*stddev
- type: custom
  name: statistical_bounds_token_count_input
  description: 'Statistical profile for ''token_count.input'': mean=1768.48, p95=4660.9,
    p99=33391.44, stddev=6887.771745. Values beyond mean ± 3σ trigger an anomaly alert.'
  field: token_count.input
  observed_profile:
    min: 100
    max: 44879
    mean: 1768.48
    p25: 200.0
    p50: 200.0
    p75: 200.0
    p95: 4660.9
    p99: 33391.44
    stddev: 6887.771745
  rule: mean - 3*stddev <= value <= mean + 3*stddev
- type: ai_extension
  name: llm_output_schema_enforcement
  description: LLM outputs must contain required keys with correct types.
  required_output_keys:
  - facts_extracted
  - avg_confidence
  - extraction_model
  output_schema:
    facts_extracted:
      type: integer
      minimum: 0
    avg_confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
    extraction_model:
      type: string
- type: ai_extension
  name: prompt_input_validation
  description: Prompt inputs must supply doc_id and source_path as non-empty strings.
    Empty inputs cause the LLM to hallucinate document content.
  required_input_keys:
  - doc_id
  - source_path
  validation_rules:
    doc_id:
      type: string
      minLength: 1
    source_path:
      type: string
      minLength: 1
llm_annotations:
- column: doc_id
  description: Unique identifier for the source document being processed.
  business_rule: IS NOT NULL AND matches UUID-v4 pattern
  cross_column_relationship: doc_id links extracted_facts to their source document
- column: entities
  description: The 'entities' column contains an array of named entities extracted
    from text data.
  business_rule: The 'entities' column must be a non-null array, and each entity object
    must have 'entity_id', 'name', 'type', and 'canonical_value' fields.
  cross_column_relationship: The 'entities' column is related to the 'doc_id', 'extracted_at',
    and 'extracted_facts' columns, as the entities are extracted from the text data
    in the dataset.
- column: extracted_at
  description: The extracted_at column contains timestamps of when the document extractions
    occurred.
  business_rule: extracted_at MUST be a valid ISO 8601 timestamp in the UTC timezone
  cross_column_relationship: None
- column: extracted_facts
  description: Array of fact objects extracted from the document, each with text,
    entities, and confidence.
  business_rule: len(value) >= 1 (non-empty array)
  cross_column_relationship: extracted_facts[*].confidence must equal avg_confidence
    when averaged
- column: extraction_model
  description: Name of the AI model used to extract facts from the document.
  business_rule: matches pattern ^(claude|gpt)-
  cross_column_relationship: extraction_model determines the valid range of confidence
    scores
- column: processing_time_ms
  description: The processing time in milliseconds for each data extraction.
  business_rule: processing_time_ms >= 0
  cross_column_relationship: None
- column: source_hash
  description: The source_hash column stores unique hashes for data extraction sources.
  business_rule: source_hash MUST be a non-empty string of at least 64 characters,
    consisting only of hexadecimal digits (0-9, a-f, A-F).
  cross_column_relationship: None
- column: source_path
  description: The source_path column contains file paths for various business reports.
  business_rule: source_path LIKE '%.pdf' AND LENGTH(source_path) < 100
  cross_column_relationship: None
- column: token_count.input
  description: The number of tokens in the input text, represented as an integer.
  business_rule: token_count.input > 0
  cross_column_relationship: The token_count.input should match the token_count.output
    column.
- column: token_count.output
  description: The token_count.output column represents the number of tokens extracted
    from a text source.
  business_rule: token_count.output >= 0
  cross_column_relationship: token_count.output should be greater than or equal to
    token_count.input
