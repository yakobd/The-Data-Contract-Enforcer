version: 2
models:
- name: events
  description: Canonical events records from the Week 7 Data Contract Enforcer.
  columns:
  - name: aggregate_id
    description: The aggregate_id column stores unique identifiers for different types
      of events.
    tests:
    - not_null
    - relationships:
        to: ref('events')
        field: aggregate_id
  - name: aggregate_type
    description: The aggregate_type column identifies the type of event recorded in
      the events table.
    tests:
    - accepted_values:
        values:
        - LoanApplication
        - Document
        - CreditAnalysis
        - FraudCheck
        - LoanDecision
  - name: event_id
    description: Unique identifier (UUIDv4) for this immutable event record.
    tests:
    - not_null
    - unique
  - name: event_type
    description: PascalCase domain event type registered in the event schema registry.
    tests:
    - not_null
  - name: metadata.causation_id
    description: The causation_id column stores a unique identifier for the event's
      cause.
  - name: metadata.correlation_id
    description: The correlation_id column is a unique identifier for each event,
      and should be a valid UUID.
  - name: metadata.source_service
    description: The source_service column indicates the service that generated the
      event.
  - name: metadata.user_id
    description: The user_id column should contain a string representing a unique
      user identifier.
  - name: occurred_at
    description: ISO 8601 UTC timestamp when the domain event occurred (business time).
    tests:
    - not_null
  - name: payload.added_at
    description: The payload.added_at column contains timestamp data in UTC format
      for event occurrences.
  - name: payload.agent_id
    description: The agent_id column should contain a valid agent identifier as a
      string
  - name: payload.agent_type
    description: Ensure the agent_type column is one of the expected values for document
      processing.
  - name: payload.anomalies
    description: The anomalies column should not be empty if the application_id is
      present.
  - name: payload.applicant_id
    description: The applicant_id column should contain alphanumeric strings starting
      with 'COMP-' and followed by a 3-digit number.
  - name: payload.application_id
    description: The application_id column should contain a string starting with 'APEX-'
      followed by four digits.
  - name: payload.application_reference
    description: 'The application reference must be in the format ''APEX-####'' where
      #### is a four-digit number.'
  - name: payload.assessed_at
    description: The 'assessed_at' column contains a timestamp of when the event was
      assessed.
  - name: payload.auditor_notes
    description: The auditor's notes provide a textual summary of the audit findings.
  - name: payload.called_at
    description: A string column representing the timestamp when an event was called
  - name: payload.completed_at
    description: The 'completed_at' column represents the timestamp when an event
      was completed.
  - name: payload.contact_email
    description: The contact_email column should contain valid email addresses.
  - name: payload.contact_name
    description: The contact_name field should contain a valid name, not empty or
      null.
  - name: payload.context_source
    description: The context_source column represents the source of an event's context
      information.
  - name: payload.context_token_count
    description: The context token count should be a positive integer value.
  - name: payload.created_at
    description: ISO 8601 UTC timestamp when this record was created.
  - name: payload.critical_missing_fields
    description: The critical_missing_fields array should be empty for valid event
      records.
  - name: payload.deadline
    description: Field payload.deadline.
  - name: payload.detected_format
    description: Ensure the detected format of the document is 'pdf'.
  - name: payload.document_format
    description: The document format must be either 'pdf' or 'xlsx'.
  - name: payload.document_id
    description: The document_id column must be a unique identifier for each document
      processed.
  - name: payload.document_type
    description: 'Ensure that the document type is one of the expected values: application_proposal,
      income_statement, or balance_sheet.'
  - name: payload.documents_processed
    description: The number of documents processed as part of an event.
  - name: payload.duration_ms
    description: The duration of each event in milliseconds, must be a positive integer.
  - name: payload.events_written
    description: The events_written array contains details about each event processed
      in the data pipeline.
  - name: payload.executed_at
    description: The executed_at column represents the timestamp of when an event
      occurred.
  - name: payload.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: payload.facts
    description: The 'payload.facts' column contains financial data in an object format,
      with various financial metrics.
  - name: payload.file_hash
    description: Ensure file_hash is a unique 16-character hexadecimal string
  - name: payload.file_path
    description: The file_path column contains file paths for various financial documents
      associated with a company.
  - name: payload.file_size_bytes
    description: The file size in bytes for each event must be a positive integer.
  - name: payload.filename
    description: Filenames should follow the format 'APEX-XXXX_document_type.extension'.
  - name: payload.fiscal_year
    description: The fiscal year must be a valid integer between 2020 and 2030.
  - name: payload.has_quality_flags
    description: The 'has_quality_flags' column indicates if the event payload has
      quality flags.
  - name: payload.input_keys
    description: An array of input keys used in the event payload
  - name: payload.inputs_validated
    description: Validates that the 'inputs_validated' array contains specific required
      fields.
  - name: payload.is_coherent
    description: The is_coherent field indicates if the payload data is valid and
      coherent.
  - name: payload.langgraph_graph_version
    description: The langgraph_graph_version column represents the version of the
      language graph used in the event.
  - name: payload.llm_called
    description: The 'llm_called' column indicates if a large language model was used
      for the event.
  - name: payload.llm_cost_usd
    description: The llm_cost_usd column represents the cost in USD for the language
      model used in the event.
  - name: payload.llm_tokens_input
    description: The number of tokens input to the language model for the event.
  - name: payload.llm_tokens_output
    description: The number of LLM tokens output for a given event.
  - name: payload.loan_purpose
    description: 'The loan purpose field should be one of four valid options: working_capital,
      acquisition, real_estate, or expansion.'
  - name: payload.loan_term_months
    description: The loan term in months should be a positive integer within the range
      of 12 to 84 months.
  - name: payload.model_version
    description: The model version should be in the format 'claude-sonnet-4-YYYYMMDD'.
  - name: payload.node_name
    description: The node_name column contains the names of the data processing steps.
  - name: payload.node_sequence
    description: The node_sequence column represents the sequence of nodes in the
      event payload.
  - name: payload.output_keys
    description: The 'payload.output_keys' column contains an array of keys representing
      the output of a data processing step.
  - name: payload.output_summary
    description: The output summary provides a high-level summary of the processing
      and analysis of a package.
  - name: payload.overall_confidence
    description: The overall confidence score of an event payload, ranging from 0
      to 1.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: payload.package_id
    description: The package_id column contains a string identifier for a package
      with a prefix 'APEX-' followed by four digits.
  - name: payload.page_count
    description: The payload.page_count column represents the number of pages in a
      document.
  - name: payload.pipeline_version
    description: The pipeline version should be a valid version number in the format
      'weekX-v#.#'.
  - name: payload.processing_ms
    description: The processing time in milliseconds for an event payload.
  - name: payload.quality_flag_count
    description: The quality_flag_count column represents the number of quality flags
      detected in the event.
  - name: payload.raw_text_length
    description: The raw text length of the event payload should be a positive integer
      value.
  - name: payload.ready_at
    description: The ready_at column represents the time when the event payload is
      ready for processing.
  - name: payload.reextraction_recommended
    description: Indicates whether the event data needs to be re-extracted.
  - name: payload.requested_amount_usd
    description: The requested_amount_usd column should be a valid decimal number.
  - name: payload.requested_by
    description: The 'requested_by' column should only contain the value 'system'
      to indicate an automated request.
  - name: payload.required_document_types
    description: Ensure the required document types are present in the 'required_documents'
      array.
  - name: payload.required_documents
    description: The 'required_documents' array should contain at least one of the
      required document types.
  - name: payload.session_id
    description: A unique identifier for each session run in the system.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: payload.started_at
    description: The 'started_at' column represents the timestamp when an event was
      initiated.
  - name: payload.submission_channel
    description: 'Ensure the submission channel is one of the valid values: branch,
      web, mobile, or agent.'
  - name: payload.submitted_at
    description: The submitted_at column represents the timestamp when the event payload
      was submitted.
  - name: payload.tables_extracted
    description: The number of tables extracted from the payload for the event.
  - name: payload.tool_duration_ms
    description: The tool duration in milliseconds for the event data.
  - name: payload.tool_input_summary
    description: The tool_input_summary column stores a string describing the input
      document type and task performed.
  - name: payload.tool_name
    description: The tool_name column contains the name of the tool used in the data
      extraction process.
  - name: payload.tool_output_summary
    description: The tool_output_summary column contains a summary of the number of
      financial line items extracted.
  - name: payload.uploaded_at
    description: The 'uploaded_at' column contains timestamp data for when files were
      uploaded to the system.
  - name: payload.uploaded_by
    description: Ensure the 'uploaded_by' field is always populated with a non-empty
      string value.
  - name: payload.validated_at
    description: The 'validated_at' column represents the timestamp when an event
      was validated.
  - name: payload.validation_duration_ms
    description: The validation duration of an event, in milliseconds.
  - name: payload.written_at
    description: Ensure the 'written_at' timestamp is a valid ISO 8601 timestamp
  - name: recorded_at
    description: ISO 8601 UTC timestamp when the event was written to the store.
    tests:
    - not_null
  - name: schema_version
    description: The schema_version column stores the version of the data schema used
      for the event.
  - name: sequence_number
    description: Monotonically increasing integer per aggregate_id ensuring strict
      ordering.
    tests:
    - not_null
