version: 2
models:
- name: events
  description: Canonical events records from the Week 7 Data Contract Enforcer.
  columns:
  - name: aggregate_id
    description: The aggregate_id column stores a universally unique identifier (UUID)
      for each event.
    tests:
    - not_null
    - relationships:
        to: ref('events')
        field: aggregate_id
  - name: aggregate_type
    description: The `aggregate_type` column stores high-level categorization of events
      in the system.
    tests:
    - accepted_values:
        values:
        - LoanApplication
        - Document
        - CreditAnalysis
        - FraudCheck
        - LoanDecision
  - name: event_id
    description: Unique identifier (UUIDv4) for this immutable event record.
    tests:
    - not_null
    - unique
  - name: event_type
    description: PascalCase domain event type registered in the event schema registry.
    tests:
    - not_null
  - name: metadata.causation_id
    description: The causation_id column stores a unique identifier for the event
      that caused the current event.
  - name: metadata.correlation_id
    description: A unique identifier to connect events related to the same user action.
  - name: metadata.source_service
    description: The source_service column indicates the service that generated the
      event.
  - name: metadata.user_id
    description: The user_id column should contain a unique identifier for each user.
  - name: occurred_at
    description: ISO 8601 UTC timestamp when the domain event occurred (business time).
    tests:
    - not_null
  - name: payload.added_at
    description: The added_at column represents the timestamp when the event was created.
  - name: payload.agent_id
    description: The agent_id column should be a non-null string value without leading
      or trailing whitespace.
  - name: payload.agent_type
    description: Ensure the 'agent_type' field in the 'events' table is 'document_processing'.
  - name: payload.anomalies
    description: The payload.anomalies column should be an array with at least one
      element.
  - name: payload.applicant_id
    description: Ensure the applicant_id column contains a valid COMP-XXX format string.
  - name: payload.application_id
    description: Ensure the application ID follows the pattern 'APEX-xxxx' where xxxx
      is a 4-digit number.
  - name: payload.application_reference
    description: The application_reference column contains unique identifiers for
      APEX application records.
  - name: payload.assessed_at
    description: The 'assessed_at' column represents the timestamp when an event was
      assessed, in ISO 8601 format.
  - name: payload.auditor_notes
    description: The auditor notes field should contain a summary of the audit findings
      in plain language.
  - name: payload.called_at
    description: The 'called_at' column represents the timestamp of when an event
      was called.
  - name: payload.completed_at
    description: The completed_at column represents the timestamp when an event was
      completed.
  - name: payload.contact_email
    description: The contact_email column should contain a valid email address for
      each event.
  - name: payload.contact_name
    description: The contact_name column should contain only valid names, without
      any special characters or numbers.
  - name: payload.context_source
    description: The context_source column contains the source of the event context,
      which is a string value.
  - name: payload.context_token_count
    description: The number of tokens in the context of the event.
  - name: payload.created_at
    description: ISO 8601 UTC timestamp when this record was created.
  - name: payload.critical_missing_fields
    description: Array of critical missing fields in an event payload.
  - name: payload.deadline
    description: Ensure the 'deadline' field is a valid ISO 8601 datetime string with
      time zone information.
  - name: payload.detected_format
    description: The 'detected_format' field should be 'pdf' and match the 'document_format'
      field.
  - name: payload.document_format
    description: Validate that the document format is either 'pdf' or 'xlsx'.
  - name: payload.document_id
    description: Ensure the document_id column is a valid string format with no duplicates.
  - name: payload.document_type
    description: The payload.document_type column stores the type of document, such
      as application proposal, income statement, or balance sheet.
  - name: payload.documents_processed
    description: The number of documents processed in the event payload.
  - name: payload.duration_ms
    description: The duration in milliseconds of an event, which should be a positive
      integer.
  - name: payload.events_written
    description: An array of event metadata, including stream ID, event type, and
      stream position.
  - name: payload.executed_at
    description: The executed_at column contains ISO 8601 formatted timestamps indicating
      when an event occurred.
  - name: payload.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: payload.facts
    description: Field payload.facts.
  - name: payload.file_hash
    description: The file_hash column contains a unique identifier for each file in
      the events table.
  - name: payload.file_path
    description: The file path column contains file paths for financial documents
      related to a company.
  - name: payload.file_size_bytes
    description: The file size in bytes should be a positive integer.
  - name: payload.filename
    description: The filename should follow the pattern 'APEX-XXXX_<file_type>.<extension>'.
  - name: payload.fiscal_year
    description: The fiscal year should be a positive integer representing the calendar
      year.
  - name: payload.has_quality_flags
    description: The 'has_quality_flags' column indicates whether the event payload
      has quality flags enabled.
  - name: payload.input_keys
    description: The input_keys column contains an array of keys that describe the
      input data.
  - name: payload.inputs_validated
    description: Ensure that the 'inputs_validated' array contains required data fields
      for processing the event payload.
  - name: payload.is_coherent
    description: The is_coherent field indicates whether the input data is valid and
      coherent.
  - name: payload.langgraph_graph_version
    description: The langgraph_graph_version column represents the version of the
      language graph used for the event.
  - name: payload.llm_called
    description: The 'llm_called' column indicates whether a large language model
      was used for the event.
  - name: payload.llm_cost_usd
    description: The 'llm_cost_usd' column represents the cost of the language model
      in USD for a given event.
  - name: payload.llm_tokens_input
    description: The number of tokens input to the large language model for this event.
  - name: payload.llm_tokens_output
    description: The number of output tokens generated by the language model in the
      event.
  - name: payload.loan_purpose
    description: The 'loan_purpose' column contains the purpose of the loan, with
      valid values such as 'working_capital', 'acquisition', 'real_estate', and 'expansion'.
  - name: payload.loan_term_months
    description: The loan term in months must be a positive integer value.
  - name: payload.model_version
    description: The model version should be a string in the format 'claude-sonnet-4-YYYYMMDD'.
  - name: payload.node_name
    description: The node_name column represents the name of a data processing step
      in the events pipeline.
  - name: payload.node_sequence
    description: The node_sequence column represents the order of nodes in a sequence.
  - name: payload.output_keys
    description: The payload.output_keys column contains an array of output keys for
      each event.
  - name: payload.output_summary
    description: Summarizes the output of a document processing step in a credit analysis
      workflow.
  - name: payload.overall_confidence
    description: The overall confidence score for the event, a number between 0 and
      1.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: payload.package_id
    description: The package_id column contains unique identifiers for each package
      processed by the system.
  - name: payload.page_count
    description: The page_count column represents the number of pages in the event
      payload.
  - name: payload.pipeline_version
    description: Validates that the pipeline version is in the format 'week{number}-v{version
      number}.{patch number}'.
  - name: payload.processing_ms
    description: The processing time in milliseconds for the event payload.
  - name: payload.quality_flag_count
    description: The quality_flag_count field represents the number of quality flags
      detected in the event payload.
  - name: payload.raw_text_length
    description: The raw text length of an event should be a positive integer.
  - name: payload.ready_at
    description: The payload.ready_at column represents the timestamp when the event
      was ready to be processed.
  - name: payload.reextraction_recommended
    description: The reextraction_recommended flag indicates whether the event payload
      should be reextracted.
  - name: payload.requested_amount_usd
    description: The requested amount should be a valid decimal value in USD.
  - name: payload.requested_by
    description: The 'requested_by' column should be a string with the value 'system'.
  - name: payload.required_document_types
    description: The 'required_document_types' array must contain valid document types
      for the financial request.
  - name: payload.required_documents
    description: The 'required_documents' field must contain at least one valid document
      type.
  - name: payload.session_id
    description: A unique identifier for each run session of a data processing job.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: payload.started_at
    description: The 'started_at' column represents the timestamp when an event was
      initiated.
  - name: payload.submission_channel
    description: The 'submission_channel' column indicates the source of the event
      submission.
  - name: payload.submitted_at
    description: The submitted_at column represents the timestamp when an event was
      submitted.
  - name: payload.tables_extracted
    description: The number of tables extracted during an event.
  - name: payload.tool_duration_ms
    description: The tool duration in milliseconds for the event payload.
  - name: payload.tool_input_summary
    description: The 'tool_input_summary' column contains a summary of the input data
      for a tool used in the event.
  - name: payload.tool_name
    description: The tool_name column represents the name of the tool used in the
      data processing pipeline.
  - name: payload.tool_output_summary
    description: The 'payload.tool_output_summary' column contains a summary of the
      financial line items extracted by a tool.
  - name: payload.uploaded_at
    description: Field payload.uploaded_at.
  - name: payload.uploaded_by
    description: The 'uploaded_by' column should only contain the value 'applicant'.
  - name: payload.validated_at
    description: Ensure the 'validated_at' timestamp is a valid ISO 8601 format date
      and time.
  - name: payload.validation_duration_ms
    description: The validation_duration_ms column represents the time in milliseconds
      for the event validation process.
  - name: payload.written_at
    description: The 'written_at' column represents the timestamp when the event was
      written to the database.
  - name: recorded_at
    description: ISO 8601 UTC timestamp when the event was written to the store.
    tests:
    - not_null
  - name: schema_version
    description: The schema_version column stores the version of the data schema used
      for the event.
  - name: sequence_number
    description: Monotonically increasing integer per aggregate_id ensuring strict
      ordering.
    tests:
    - not_null
