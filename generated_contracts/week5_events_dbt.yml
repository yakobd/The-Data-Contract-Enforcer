version: 2
models:
- name: events
  description: Canonical events records from the Week 7 Data Contract Enforcer.
  columns:
  - name: aggregate_id
    description: Field aggregate_id.
    tests:
    - not_null
    - relationships:
        to: ref('events')
        field: aggregate_id
  - name: aggregate_type
    description: Field aggregate_type.
    tests:
    - accepted_values:
        values:
        - LoanApplication
        - Document
        - CreditAnalysis
        - FraudCheck
        - LoanDecision
  - name: event_id
    description: Unique identifier (UUIDv4) for this immutable event record.
    tests:
    - not_null
    - unique
  - name: event_type
    description: PascalCase domain event type registered in the event schema registry.
    tests:
    - not_null
  - name: metadata.causation_id
    description: Field metadata.causation_id.
  - name: metadata.correlation_id
    description: Field metadata.correlation_id.
  - name: metadata.source_service
    description: Field metadata.source_service.
  - name: metadata.user_id
    description: Field metadata.user_id.
  - name: occurred_at
    description: ISO 8601 UTC timestamp when the domain event occurred (business time).
    tests:
    - not_null
  - name: payload.added_at
    description: Field payload.added_at.
  - name: payload.agent_id
    description: Field payload.agent_id.
  - name: payload.agent_type
    description: Field payload.agent_type.
  - name: payload.anomalies
    description: Field payload.anomalies.
  - name: payload.applicant_id
    description: Field payload.applicant_id.
  - name: payload.application_id
    description: Field payload.application_id.
  - name: payload.application_reference
    description: Field payload.application_reference.
  - name: payload.assessed_at
    description: Field payload.assessed_at.
  - name: payload.auditor_notes
    description: Field payload.auditor_notes.
  - name: payload.called_at
    description: Field payload.called_at.
  - name: payload.completed_at
    description: Field payload.completed_at.
  - name: payload.contact_email
    description: Field payload.contact_email.
  - name: payload.contact_name
    description: Field payload.contact_name.
  - name: payload.context_source
    description: Field payload.context_source.
  - name: payload.context_token_count
    description: Field payload.context_token_count.
  - name: payload.created_at
    description: ISO 8601 UTC timestamp when this record was created.
  - name: payload.critical_missing_fields
    description: Field payload.critical_missing_fields.
  - name: payload.deadline
    description: Field payload.deadline.
  - name: payload.detected_format
    description: Field payload.detected_format.
  - name: payload.document_format
    description: Field payload.document_format.
  - name: payload.document_id
    description: Field payload.document_id.
  - name: payload.document_type
    description: Field payload.document_type.
  - name: payload.documents_processed
    description: Field payload.documents_processed.
  - name: payload.duration_ms
    description: Field payload.duration_ms.
  - name: payload.events_written
    description: Field payload.events_written.
  - name: payload.executed_at
    description: Field payload.executed_at.
  - name: payload.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: payload.facts
    description: Field payload.facts.
  - name: payload.file_hash
    description: Field payload.file_hash.
  - name: payload.file_path
    description: Field payload.file_path.
  - name: payload.file_size_bytes
    description: Field payload.file_size_bytes.
  - name: payload.filename
    description: Field payload.filename.
  - name: payload.fiscal_year
    description: Field payload.fiscal_year.
  - name: payload.has_quality_flags
    description: Field payload.has_quality_flags.
  - name: payload.input_keys
    description: Field payload.input_keys.
  - name: payload.inputs_validated
    description: Field payload.inputs_validated.
  - name: payload.is_coherent
    description: Field payload.is_coherent.
  - name: payload.langgraph_graph_version
    description: Field payload.langgraph_graph_version.
  - name: payload.llm_called
    description: Field payload.llm_called.
  - name: payload.llm_cost_usd
    description: Field payload.llm_cost_usd.
  - name: payload.llm_tokens_input
    description: Field payload.llm_tokens_input.
  - name: payload.llm_tokens_output
    description: Field payload.llm_tokens_output.
  - name: payload.loan_purpose
    description: Field payload.loan_purpose.
  - name: payload.loan_term_months
    description: Field payload.loan_term_months.
  - name: payload.model_version
    description: Field payload.model_version.
  - name: payload.node_name
    description: Field payload.node_name.
  - name: payload.node_sequence
    description: Field payload.node_sequence.
  - name: payload.output_keys
    description: Field payload.output_keys.
  - name: payload.output_summary
    description: Field payload.output_summary.
  - name: payload.overall_confidence
    description: Field payload.overall_confidence.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: payload.package_id
    description: Field payload.package_id.
  - name: payload.page_count
    description: Field payload.page_count.
  - name: payload.pipeline_version
    description: Field payload.pipeline_version.
  - name: payload.processing_ms
    description: Field payload.processing_ms.
  - name: payload.quality_flag_count
    description: Field payload.quality_flag_count.
  - name: payload.raw_text_length
    description: Field payload.raw_text_length.
  - name: payload.ready_at
    description: Field payload.ready_at.
  - name: payload.reextraction_recommended
    description: Field payload.reextraction_recommended.
  - name: payload.requested_amount_usd
    description: Field payload.requested_amount_usd.
  - name: payload.requested_by
    description: Field payload.requested_by.
  - name: payload.required_document_types
    description: Field payload.required_document_types.
  - name: payload.required_documents
    description: Field payload.required_documents.
  - name: payload.session_id
    description: Field payload.session_id.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: payload.started_at
    description: Field payload.started_at.
  - name: payload.submission_channel
    description: Field payload.submission_channel.
  - name: payload.submitted_at
    description: Field payload.submitted_at.
  - name: payload.tables_extracted
    description: Field payload.tables_extracted.
  - name: payload.tool_duration_ms
    description: Field payload.tool_duration_ms.
  - name: payload.tool_input_summary
    description: Field payload.tool_input_summary.
  - name: payload.tool_name
    description: Field payload.tool_name.
  - name: payload.tool_output_summary
    description: Field payload.tool_output_summary.
  - name: payload.uploaded_at
    description: Field payload.uploaded_at.
  - name: payload.uploaded_by
    description: Field payload.uploaded_by.
  - name: payload.validated_at
    description: Field payload.validated_at.
  - name: payload.validation_duration_ms
    description: Field payload.validation_duration_ms.
  - name: payload.written_at
    description: Field payload.written_at.
  - name: recorded_at
    description: ISO 8601 UTC timestamp when the event was written to the store.
    tests:
    - not_null
  - name: schema_version
    description: Field schema_version.
  - name: sequence_number
    description: Monotonically increasing integer per aggregate_id ensuring strict
      ordering.
    tests:
    - not_null
