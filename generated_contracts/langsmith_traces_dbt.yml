version: 2
models:
- name: runs
  description: Canonical runs records from the Week 7 Data Contract Enforcer.
  columns:
  - name: completion_tokens
    description: The completion_tokens column represents the number of tokens used
      during a run.
    tests:
    - not_null
  - name: end_time
    description: ISO 8601 UTC timestamp when this run ended.
    tests:
    - not_null
  - name: error
    description: 'The error column should contain one of the values: ''none'' or another
      string value.'
  - name: id
    description: Unique identifier for this LangSmith trace run.
    tests:
    - not_null
    - unique
  - name: inputs.doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - relationships:
        to: ref('extractions')
        field: doc_id
  - name: inputs.source_path
    description: The source path of the input files should be a valid file name with
      a .pdf extension.
  - name: inputs.strategy
    description: The 'inputs.strategy' column contains the strategy used for a document
      processing run.
  - name: inputs.texts
    description: The 'inputs.texts' column contains an array of extracted text from
      various documents.
  - name: name
    description: A table containing the names of text extraction and embedding models.
    tests:
    - not_null
  - name: outputs.avg_confidence
    description: The average confidence score for the output of a text extraction
      model.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: outputs.embedding_dim
    description: The embedding dimension for the model outputs, which should be a
      positive integer.
  - name: outputs.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: outputs.facts_count
    description: The number of facts extracted from the run, an integer value.
  - name: outputs.facts_extracted
    description: The number of facts extracted from the run, as an integer value.
  - name: outputs.status
    description: The 'outputs.status' column should be 'SUCCESS' for all rows.
  - name: outputs.vectors_created
    description: The number of vectors created during the run of a data processing
      task.
  - name: parent_run_id
    description: The parent_run_id column stores a unique identifier for the parent
      run of the current run.
    tests:
    - relationships:
        to: ref('runs')
        field: id
  - name: prompt_tokens
    description: The 'prompt_tokens' column represents the number of tokens in the
      prompt for a run.
    tests:
    - not_null
  - name: run_type
    description: 'LangSmith run classification: llm, chain, tool, retriever, or embedding.'
    tests:
    - not_null
    - accepted_values:
        values:
        - llm
        - chain
        - tool
        - retriever
        - embedding
  - name: session_id
    description: A unique identifier for each run session of a data processing job.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: start_time
    description: ISO 8601 UTC timestamp when this run started.
    tests:
    - not_null
  - name: tags
    description: The tags column contains an array of strings describing the purpose
      of each run.
  - name: total_cost
    description: Estimated USD cost for this run based on per-token pricing.
  - name: total_tokens
    description: Total tokens consumed; must equal prompt_tokens + completion_tokens.
    tests:
    - not_null
