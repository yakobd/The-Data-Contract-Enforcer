version: 2
models:
- name: runs
  description: Canonical runs records from the Week 7 Data Contract Enforcer.
  columns:
  - name: completion_tokens
    description: Field completion_tokens.
    tests:
    - not_null
  - name: end_time
    description: ISO 8601 UTC timestamp when this run ended.
    tests:
    - not_null
  - name: error
    description: Field error.
  - name: id
    description: Unique identifier for this LangSmith trace run.
    tests:
    - not_null
    - unique
  - name: inputs.doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - relationships:
        to: ref('extractions')
        field: doc_id
  - name: inputs.source_path
    description: Field inputs.source_path.
  - name: inputs.strategy
    description: Field inputs.strategy.
  - name: inputs.texts
    description: Field inputs.texts.
  - name: name
    description: Field name.
    tests:
    - not_null
  - name: outputs.avg_confidence
    description: Field outputs.avg_confidence.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: outputs.embedding_dim
    description: Field outputs.embedding_dim.
  - name: outputs.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: outputs.facts_count
    description: Field outputs.facts_count.
  - name: outputs.facts_extracted
    description: Field outputs.facts_extracted.
  - name: outputs.status
    description: Field outputs.status.
  - name: outputs.vectors_created
    description: Field outputs.vectors_created.
  - name: parent_run_id
    description: Field parent_run_id.
    tests:
    - relationships:
        to: ref('runs')
        field: id
  - name: prompt_tokens
    description: Field prompt_tokens.
    tests:
    - not_null
  - name: run_type
    description: 'LangSmith run classification: llm, chain, tool, retriever, or embedding.'
    tests:
    - not_null
    - accepted_values:
        values:
        - llm
        - chain
        - tool
        - retriever
        - embedding
  - name: session_id
    description: Field session_id.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: start_time
    description: ISO 8601 UTC timestamp when this run started.
    tests:
    - not_null
  - name: tags
    description: Field tags.
  - name: total_cost
    description: Estimated USD cost for this run based on per-token pricing.
  - name: total_tokens
    description: Total tokens consumed; must equal prompt_tokens + completion_tokens.
    tests:
    - not_null
