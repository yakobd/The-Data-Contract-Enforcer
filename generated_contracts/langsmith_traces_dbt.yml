version: 2
models:
- name: runs
  description: Canonical runs records from the Week 7 Data Contract Enforcer.
  columns:
  - name: completion_tokens
    description: The completion_tokens column represents the number of tokens used
      in a run.
    tests:
    - not_null
  - name: end_time
    description: ISO 8601 UTC timestamp when this run ended.
    tests:
    - not_null
  - name: error
    description: The 'error' column should only contain the string 'none' if no errors
      occurred during the run.
  - name: id
    description: Unique identifier for this LangSmith trace run.
    tests:
    - not_null
    - unique
  - name: inputs.doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - relationships:
        to: ref('extractions')
        field: doc_id
  - name: inputs.source_path
    description: The source path column stores the file names of various documents.
  - name: inputs.strategy
    description: The 'inputs.strategy' column stores the strategy used for the data
      run.
  - name: inputs.texts
    description: The 'inputs.texts' column stores text extracted from various documents.
  - name: name
    description: A table of data processing runs, with input text and output metadata.
    tests:
    - not_null
  - name: outputs.avg_confidence
    description: The average confidence score of the text extraction process for each
      run.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: outputs.embedding_dim
    description: The embedding dimension of the model outputs, an integer value.
  - name: outputs.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: outputs.facts_count
    description: The number of facts extracted from the input data.
  - name: outputs.facts_extracted
    description: The number of facts extracted during the run, an integer value.
  - name: outputs.status
    description: The status of a run must be 'SUCCESS' and the associated counts and
      IDs must be non-negative integers.
  - name: outputs.vectors_created
    description: The number of vectors created during the run process.
  - name: parent_run_id
    description: The parent_run_id column stores the unique identifier for parent
      runs.
    tests:
    - relationships:
        to: ref('runs')
        field: id
  - name: prompt_tokens
    description: The prompt_tokens column represents the number of tokens used in
      a given run.
    tests:
    - not_null
  - name: run_type
    description: 'LangSmith run classification: llm, chain, tool, retriever, or embedding.'
    tests:
    - not_null
    - accepted_values:
        values:
        - llm
        - chain
        - tool
        - retriever
        - embedding
  - name: session_id
    description: A unique identifier for each session run in the system.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: start_time
    description: ISO 8601 UTC timestamp when this run started.
    tests:
    - not_null
  - name: tags
    description: The tags column contains an array of text tags describing the run.
  - name: total_cost
    description: Estimated USD cost for this run based on per-token pricing.
  - name: total_tokens
    description: Total tokens consumed; must equal prompt_tokens + completion_tokens.
    tests:
    - not_null
