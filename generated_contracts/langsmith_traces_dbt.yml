version: 2
models:
- name: runs
  description: Canonical runs records from the Week 7 Data Contract Enforcer.
  columns:
  - name: completion_tokens
    description: The number of tokens used to complete the run, a non-negative integer.
    tests:
    - not_null
  - name: end_time
    description: ISO 8601 UTC timestamp when this run ended.
    tests:
    - not_null
  - name: error
    description: The 'error' column should only contain the value 'none' for successful
      runs.
  - name: id
    description: Unique identifier for this LangSmith trace run.
    tests:
    - not_null
    - unique
  - name: inputs.doc_id
    description: Unique identifier for the source document being processed.
    tests:
    - relationships:
        to: ref('extractions')
        field: doc_id
  - name: inputs.source_path
    description: The source_path column stores the file names of financial and audit
      reports.
  - name: inputs.strategy
    description: The 'inputs.strategy' column stores the strategy used for the data
      run.
  - name: inputs.texts
    description: The 'inputs.texts' column contains an array of extracted text from
      various documents.
  - name: name
    description: The runs table contains names of various data processing models.
    tests:
    - not_null
  - name: outputs.avg_confidence
    description: The `outputs.avg_confidence` column represents the average confidence
      of the extraction model.
    tests:
    - dbt_utils.accepted_range:
        min_value: 0.0
        max_value: 1.0
        inclusive: true
  - name: outputs.embedding_dim
    description: The embedding dimension of the output, which represents the size
      of the embedding vector.
  - name: outputs.extraction_model
    description: Name of the AI model used to extract facts from the document.
  - name: outputs.facts_count
    description: The number of facts extracted from a document during a run.
  - name: outputs.facts_extracted
    description: The number of facts extracted from the input data during the extraction
      process.
  - name: outputs.status
    description: The 'outputs.status' column represents the outcome of a data processing
      run.
  - name: outputs.vectors_created
    description: The number of vectors created during the run of a data processing
      task.
  - name: parent_run_id
    description: The parent_run_id column holds a unique identifier for each run in
      the runs table.
    tests:
    - relationships:
        to: ref('runs')
        field: id
  - name: prompt_tokens
    description: The prompt_tokens column represents the number of tokens in the model's
      input prompt for a given run.
    tests:
    - not_null
  - name: run_type
    description: 'LangSmith run classification: llm, chain, tool, retriever, or embedding.'
    tests:
    - not_null
    - accepted_values:
        values:
        - llm
        - chain
        - tool
        - retriever
        - embedding
  - name: session_id
    description: A unique identifier for each session of the application.
    tests:
    - relationships:
        to: ref('runs')
        field: session_id
  - name: start_time
    description: ISO 8601 UTC timestamp when this run started.
    tests:
    - not_null
  - name: tags
    description: The 'tags' column contains an array of tags describing the nature
      of each run.
  - name: total_cost
    description: Estimated USD cost for this run based on per-token pricing.
  - name: total_tokens
    description: Total tokens consumed; must equal prompt_tokens + completion_tokens.
    tests:
    - not_null
