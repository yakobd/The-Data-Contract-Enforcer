llm_annotations:
- column: code_refs
  description: The code_refs column contains an array of code references with associated
    metadata.
  business_rule: The code_refs array must contain at least one element and each element
    must have a 'file', 'line_start', 'line_end', 'symbol', and 'confidence' property.
  cross_column_relationship: The code_refs column is related to the created_at and
    description columns, as it provides additional context and information about the
    intent records.
- column: created_at
  description: ISO 8601 UTC timestamp when this record was created.
  business_rule: IS NOT NULL AND created_at <= NOW()
  cross_column_relationship: created_at must be <= recorded_at for event records
- column: description
  description: Describes the intent behind code changes to the application.
  business_rule: description MUST NOT be empty and SHOULD be less than 200 characters.
  cross_column_relationship: intent_id
- column: governance_tags
  description: The governance_tags column stores an array of tags related to data
    governance.
  business_rule: governance_tags MUST be a non-empty array containing at least one
    valid tag (e.g., 'evolution', 'refactor', 'feature')
  cross_column_relationship: None
- column: intent_id
  description: Unique identifier for a developer intent event.
  business_rule: IS NOT NULL AND UNIQUE
  cross_column_relationship: intent_id groups related code_refs under a single developer
    goal
